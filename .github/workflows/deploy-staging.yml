name: Deploy a Staging

on:
  push:
    branches:
      - claude/nifty-mendel-bW9b5
    paths:
      - 'web/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH al Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Deploy al servidor de staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -e
            REPO_DIR=/var/www/clinica-staging
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: $REPO_DIR no es un repo git. Ejecuta primero el script de setup."
              exit 1
            fi
            cd "$REPO_DIR"
            git fetch origin claude/nifty-mendel-bW9b5
            git reset --hard origin/claude/nifty-mendel-bW9b5
            echo "✓ Deploy OK — $(git rev-parse --short HEAD) — $(date -u)"
